spring.application.name=canchas-api

# Base de datos
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/canchas_db?TimeZone=UTC}
spring.datasource.username=${DATABASE_USER:postgres}
spring.datasource.password=${DATABASE_PASSWORD:postgres}

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.docker.compose.enabled=false

# JWT
jwt.secret=${JWT_SECRET:canchasApiKeyTest123456JWTNGALEANO13}
jwt.expiration=${JWT_EXPIRATION:864000000}